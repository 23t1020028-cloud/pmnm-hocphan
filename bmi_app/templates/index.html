<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính chỉ số BMI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 550px;">
        <div class="card shadow-sm p-4">
            <h3 class="card-title text-center text-primary mb-4 fw-bold">TÍNH CHỈ SỐ BMI</h3>
            
            <form method="POST" action="/" novalidate>
                
                <!-- Ô Chiều cao (cm) -->
                <div class="mb-3">
                    <label for="height" class="form-label fw-bold">Chiều cao (cm):</label>
                    <input type="text" 
                           name="height" 
                           id="height" 
                           class="form-control {{ 'is-invalid' if errors.height }}" 
                           value="{{ h_val }}">
                    {% if errors.height %}
                        <div class="invalid-feedback d-block">{{ errors.height }}</div>
                    {% endif %}
                </div>

                <!-- Ô Cân nặng (kg) -->
                <div class="mb-3">
                    <label for="weight" class="form-label fw-bold">Cân nặng (kg):</label>
                    <input type="text" 
                           name="weight" 
                           id="weight" 
                           class="form-control {{ 'is-invalid' if errors.weight }}" 
                           value="{{ w_val }}">
                    {% if errors.weight %}
                        <div class="invalid-feedback d-block">{{ errors.weight }}</div>
                    {% endif %}
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-bold">Tính BMI</button>
            </form>

            <!-- Khung kết quả hiển thị theo màu tương ứng -->
            {% if result %}
                <div class="alert alert-{{ color_class }} text-center mt-4 mb-0 fs-5 fw-bold">
                    {{ result }}
                </div>
            {% endif %}

        </div>
    </div>
</body>
</html>
