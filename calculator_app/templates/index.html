<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính cơ bản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 650px;">
        <div class="card shadow-sm p-4">
            <h3 class="card-title text-center text-primary mb-4 fw-bold">MÁY TÍNH CƠ BẢN</h3>
            
            <form method="POST" action="/" novalidate>
                <div class="row g-2 align-items-start mb-3">
                    
                    <!-- Ô nhập a -->
                    <div class="col-md-4">
                        <label for="a" class="form-label fw-bold">Số thứ nhất (a):</label>
                        <input type="text" 
                               name="a" 
                               id="a" 
                               class="form-control {{ 'is-invalid' if errors.a }}" 
                               value="{{ a_val }}">
                        {% if errors.a %}
                            <div class="invalid-feedback d-block">{{ errors.a }}</div>
                        {% endif %}
                    </div>

                    <!-- Phép toán op -->
                    <div class="col-md-4">
                        <label for="op" class="form-label fw-bold">Phép toán (op):</label>
                        <select name="op" id="op" class="form-select {{ 'is-invalid' if errors.op }}">
                            <option value="+" {{ 'selected' if op == '+' }}>+</option>
                            <option value="-" {{ 'selected' if op == '-' }}>-</option>
                            <option value="*" {{ 'selected' if op == '*' }}>*</option>
                            <option value="/" {{ 'selected' if op == '/' }}>/</option>
                        </select>
                        {% if errors.op %}
                            <div class="invalid-feedback d-block">{{ errors.op }}</div>
                        {% endif %}
                    </div>

                    <!-- Ô nhập b -->
                    <div class="col-md-4">
                        <label for="b" class="form-label fw-bold">Số thứ hai (b):</label>
                        <input type="text" 
                               name="b" 
                               id="b" 
                               class="form-control {{ 'is-invalid' if errors.b }}" 
                               value="{{ b_val }}">
                        {% if errors.b %}
                            <div class="invalid-feedback d-block">{{ errors.b }}</div>
                        {% endif %}
                    </div>

                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Tính toán</button>
            </form>

            <!-- Kết quả tính toán -->
            {% if result %}
                <div class="alert alert-success text-center mt-4 mb-0 fs-5 fw-bold">
                    {{ result }}
                </div>
            {% endif %}

        </div>
    </div>
</body>
</html>
