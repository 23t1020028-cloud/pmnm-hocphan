{% extends "base.html" %}

{% block title %}Trang không tìm thấy - 404{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 text-danger fw-bold">404</h1>
    <h3 class="mb-3">Rất tiếc! Trang bạn tìm kiếm không tồn tại.</h3>
    <p class="text-muted fs-5">{{ message }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">Về trang chủ</a>
</div>
{% endblock %}
