<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LibraryMS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="{{ url_for('home') }}">📚 LibraryMS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Đánh dấu active cho Trang chủ -->
                    <li class="nav-item">
                        <a class="nav-link {{ 'active fw-bold text-warning' if request.endpoint == 'home' }}" 
                           href="{{ url_for('home') }}">Trang chủ</a>
                    </li>
                    <!-- Đánh dấu active cho Sách và Chi tiết sách -->
                    <li class="nav-item">
                        <a class="nav-link {{ 'active fw-bold text-warning' if request.endpoint in ['books', 'book_detail'] }}" 
                           href="{{ url_for('books') }}">Sách</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mb-5 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto border-top">
        <div class="container">
            <p class="mb-0 small">&copy; {{ current_year }} LibraryMS v0.2 - Hệ thống quản lý thư viện</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
