{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="card main-card p-4">
    <div class="card-body">
        <div class="text-center mb-4">
            <span class="badge bg-primary-subtle text-primary fw-bold px-3 py-2 mb-2">BÀI TẬP 4</span>
            <h3 class="card-title text-primary fw-bold">ĐĂNG NHẬP HỆ THỐNG</h3>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold text-secondary">Tên đăng nhập:</label>
                <input type="text" name="username" id="username" class="form-control" value="{{ username }}" placeholder="Nhập tên tài khoản (vd: an)" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-bold text-secondary">Mật khẩu:</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                <label class="form-check-label text-secondary fw-semibold" for="remember">Ghi nhớ đăng nhập</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-bold shadow-sm">Đăng nhập</button>
        </form>
    </div>
</div>
{% endblock %}
