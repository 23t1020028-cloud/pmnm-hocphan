{% extends "base.html" %}
{% block title %}Trang cá nhân{% endblock %}

{% block content %}
<div class="card main-card p-4 text-center">
    <div class="card-body py-4">
        <h2 class="card-title text-primary fw-bold mb-3">TRANG CÁ NHÂN</h2>
        <!-- Hiển thị câu chào đúng yêu cầu -->
        <div class="alert alert-success border-0 shadow-sm my-4 py-3">
            <h4 class="mb-0 fw-bold">Xin chào <span class="text-primary">{{ session.get('user') }}</span> đã đăng nhập thành công !</h4>
        </div>

        <p class="text-muted mb-4">Bạn đang truy cập vào trang hồ sơ cá nhân dành riêng cho thành viên.</p>
        </div>
    </div>
</div>
{% endblock %}
