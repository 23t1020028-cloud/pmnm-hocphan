<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ứng dụng Tổng hợp{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #F1F5F9 !important;
        }

        .custom-navbar {
            background-color: #0F172A !important;
            border-bottom: 3px solid #2563EB;
        }

        .brand-title {
            color: #38BDF8 !important;
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }

        .nav-custom-link {
            color: #F8FAFC !important;
            font-weight: 600;
            font-size: 1rem;
            padding: 8px 16px !important;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .nav-custom-link:hover {
            color: #38BDF8 !important;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-custom-link.active-page {
            color: #FF4D4D !important;
            /* Đỏ tươi tương phản rõ */
            background-color: rgba(255, 77, 77, 0.12);
            font-weight: 700;
            border-bottom: 3px solid #FF4D4D;
        }

        /* TÙY CHỈNH CARD BÀI TẬP */
        .main-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.12);
            background-color: #FFFFFF;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- HEADER / NAVBAR CỐ ĐỊNH NỀN TỐI -->
    <header class="custom-navbar shadow mb-4">
        <div class="container" style="max-width: 800px;">
            <nav class="navbar navbar-expand-lg navbar-dark py-3">
                <a class="navbar-brand brand-title d-flex align-items-center gap-2" href="{{ url_for('calculator') }}">
                    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Logo" width="32" height="32"    
                        class="d-inline-block align-text-top rounded-circle">
                    <span>TOOLKIT THB FLASK</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto gap-2">
                        <li class="nav-item">
                            <a class="nav-link nav-custom-link {{ 'active-page' if request.endpoint == 'calculator' }}"
                                href="{{ url_for('calculator') }}">1. Máy tính</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-custom-link {{ 'active-page' if request.endpoint == 'sodiem' }}"
                                href="{{ url_for('sodiem') }}">2. Tính điểm HP</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-custom-link {{ 'active-page' if request.endpoint == 'bmi' }}"
                                href="{{ url_for('bmi') }}">3. Tính BMI</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main class="container flex-grow-1" style="max-width: 650px;">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-3 mt-5 border-top text-muted small bg-white">
        © 2026 TOOLKIT THB FLASK - THB Version v1.0 Edition
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
