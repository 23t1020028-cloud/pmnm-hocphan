{% extends "base.html" %}
{% block title %}Tính chỉ số BMI{% endblock %}

{% block content %}
<div class="card main-card p-4">
    <div class="card-body">
        <div class="text-center mb-4">
            <span class="badge bg-primary-subtle text-primary fw-bold px-3 py-2 mb-2">BÀI TẬP 3</span>
            <h3 class="card-title text-primary fw-bold">TÍNH CHỈ SỐ BMI</h3>
        </div>
        
        <form method="POST" action="{{ url_for('bmi') }}" novalidate>
            <div class="mb-3">
                <label for="height" class="form-label fw-bold text-secondary">Chiều cao (cm):</label>
                <input type="text" name="height" id="height" class="form-control {{ 'is-invalid' if errors.height }}" value="{{ h_val }}" placeholder="Ví dụ: 170">
                {% if errors.height %}<div class="invalid-feedback d-block">{{ errors.height }}</div>{% endif %}
            </div>

            <div class="mb-3">
                <label for="weight" class="form-label fw-bold text-secondary">Cân nặng (kg):</label>
                <input type="text" name="weight" id="weight" class="form-control {{ 'is-invalid' if errors.weight }}" value="{{ w_val }}" placeholder="Ví dụ: 65">
                {% if errors.weight %}<div class="invalid-feedback d-block">{{ errors.weight }}</div>{% endif %}
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-bold shadow-sm">Tính BMI</button>
        </form>

        {% if result %}
            <div class="alert alert-{{ color_class }} text-center mt-4 mb-0 fs-5 fw-bold shadow-sm">{{ result }}</div>
        {% endif %}
    </div>
</div>
{% endblock %}
