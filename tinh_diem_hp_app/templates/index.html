<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính điểm học phần</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h3 class="card-title text-center text-success mb-4 fw-bold">TÍNH ĐIỂM HỌC PHẦN</h3>
            
            <form method="POST" action="/" novalidate>
                <!-- Ô Chuyên cần (10%) -->
                <div class="mb-3">
                    <label for="cc" class="form-label fw-bold">Chuyên cần (10%):</label>
                    <input type="text" 
                           name="cc" 
                           id="cc" 
                           class="form-control {{ 'is-invalid' if errors.cc }}" 
                           value="{{ cc_val }}" 
                           placeholder="Nhập điểm 0-10 (ví dụ: 10 hoặc 9,5)">
                    {% if errors.cc %}
                        <div class="invalid-feedback d-block">{{ errors.cc }}</div>
                    {% endif %}
                </div>

                <!-- Ô Giữa kỳ (30%) -->
                <div class="mb-3">
                    <label for="gk" class="form-label fw-bold">Giữa kỳ (30%):</label>
                    <input type="text" 
                           name="gk" 
                           id="gk" 
                           class="form-control {{ 'is-invalid' if errors.gk }}" 
                           value="{{ gk_val }}" 
                           placeholder="Nhập điểm 0-10">
                    {% if errors.gk %}
                        <div class="invalid-feedback d-block">{{ errors.gk }}</div>
                    {% endif %}
                </div>

                <!-- Ô Cuối kỳ (60%) -->
                <div class="mb-3">
                    <label for="ck" class="form-label fw-bold">Cuối kỳ (60%):</label>
                    <input type="text" 
                           name="ck" 
                           id="ck" 
                           class="form-control {{ 'is-invalid' if errors.ck }}" 
                           value="{{ ck_val }}" 
                           placeholder="Nhập điểm 0-10">
                    {% if errors.ck %}
                        <div class="invalid-feedback d-block">{{ errors.ck }}</div>
                    {% endif %}
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 mt-2">Tính điểm</button>
            </form>

            <!-- Kết quả tính điểm -->
            {% if result %}
                <div class="alert alert-info text-center mt-4 mb-0 fs-5 fw-bold">
                    Kết quả: {{ result }}
                </div>
            {% endif %}

        </div>
    </div>
</body>
</html>
